<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Voice KB</title>
<style>
:root {
  --bg: #0d1117;
  --surface: #161b22;
  --border: #30363d;
  --text: #e6edf3;
  --text2: #8b949e;
  --accent: #58a6ff;
  --accent2: #1f6feb;
  --green: #3fb950;
  --red: #f85149;
  --orange: #d29922;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--bg);
  color: var(--text);
  height: 100dvh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  -webkit-user-select: none;
  user-select: none;
}

/* ─── header ─── */
header {
  padding: 12px 16px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 10px;
  flex-shrink: 0;
}
header select {
  flex: 1;
  background: var(--bg);
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 8px 12px;
  font-size: 15px;
  outline: none;
}
header button {
  background: none;
  border: 1px solid var(--border);
  color: var(--text2);
  border-radius: 8px;
  padding: 8px 12px;
  font-size: 13px;
  cursor: pointer;
}
header button:hover { color: var(--text); border-color: var(--text2); }

/* ─── chat log ─── */
#chat {
  flex: 1;
  overflow-y: auto;
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.msg {
  max-width: 85%;
  padding: 10px 14px;
  border-radius: 16px;
  font-size: 15px;
  line-height: 1.5;
  word-break: break-word;
  white-space: pre-wrap;
}
.msg.user {
  align-self: flex-end;
  background: var(--accent2);
  border-bottom-right-radius: 4px;
}
.msg.assistant {
  align-self: flex-start;
  background: var(--surface);
  border: 1px solid var(--border);
  border-bottom-left-radius: 4px;
}

/* ─── center area (orb + status) ─── */
#center {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 24px 0 16px;
  flex-shrink: 0;
}
#orb-wrap {
  position: relative;
  width: 120px;
  height: 120px;
  margin-bottom: 16px;
}
#orb {
  width: 120px;
  height: 120px;
  border-radius: 50%;
  background: var(--surface);
  border: 3px solid var(--border);
  transition: all 0.3s;
}
#orb.listening {
  border-color: var(--green);
  box-shadow: 0 0 30px rgba(63, 185, 80, 0.3);
  animation: pulse-green 1.5s infinite;
}
#orb.thinking {
  border-color: var(--orange);
  box-shadow: 0 0 30px rgba(210, 153, 34, 0.3);
  animation: pulse-orange 1s infinite;
}
#orb.speaking {
  border-color: var(--accent);
  box-shadow: 0 0 30px rgba(88, 166, 255, 0.3);
  animation: pulse-blue 0.8s infinite;
}
#orb.idle {
  border-color: var(--border);
}
@keyframes pulse-green {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.06); }
}
@keyframes pulse-orange {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.04); }
}
@keyframes pulse-blue {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.05); }
}
#status {
  font-size: 14px;
  color: var(--text2);
  text-transform: uppercase;
  letter-spacing: 1px;
}

/* ─── bottom controls ─── */
#controls {
  padding: 16px;
  display: flex;
  justify-content: center;
  flex-shrink: 0;
  padding-bottom: max(16px, env(safe-area-inset-bottom));
}
#btn-talk {
  width: 72px;
  height: 72px;
  border-radius: 50%;
  border: 3px solid var(--accent);
  background: var(--surface);
  color: var(--accent);
  font-size: 28px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.2s;
}
#btn-talk:active { transform: scale(0.95); }
#btn-talk.active {
  background: var(--red);
  border-color: var(--red);
  color: #fff;
}
</style>
</head>
<body>

<header>
  <select id="sel-collection"><option value="">Loading...</option></select>
  <button id="btn-clear">Clear</button>
</header>

<div id="chat"></div>

<div id="center">
  <div id="orb-wrap"><div id="orb" class="idle"></div></div>
  <div id="status">tap to start</div>
</div>

<div id="controls">
  <button id="btn-talk">&#x1F3A4;</button>
</div>

<script>
// ── State ──
let ws = null;
let audioCtx = null;
let captureNode = null;
let mediaStream = null;
let active = false;  // conversation active?
let audioQueue = [];
let playingSource = null;
let isPlayingAudio = false;

const chat = document.getElementById('chat');
const orb = document.getElementById('orb');
const statusEl = document.getElementById('status');
const btnTalk = document.getElementById('btn-talk');
const selCollection = document.getElementById('sel-collection');
const btnClear = document.getElementById('btn-clear');

// ── Load collections ──
async function loadCollections() {
  try {
    const r = await fetch('/api/collections');
    const data = await r.json();
    selCollection.innerHTML = '';
    if (data.collections.length === 0) {
      selCollection.innerHTML = '<option value="">No collections</option>';
      return;
    }
    for (const c of data.collections) {
      const opt = document.createElement('option');
      opt.value = c;
      opt.textContent = c;
      selCollection.appendChild(opt);
    }
  } catch (e) {
    selCollection.innerHTML = '<option value="">Error loading</option>';
  }
}
loadCollections();

// ── Chat log ──
function addMessage(role, text) {
  const div = document.createElement('div');
  div.className = `msg ${role}`;
  div.textContent = text;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

// ── Status & orb ──
function setStatus(text, orbClass) {
  statusEl.textContent = text;
  orb.className = orbClass || 'idle';
}

// ── Audio playback queue ──
// We receive MP3 chunks from server, decode them, and play in sequence.
function ensurePlaybackContext() {
  if (!audioCtx || audioCtx.state === 'closed') {
    audioCtx = new AudioContext();
  }
  if (audioCtx.state === 'suspended') {
    audioCtx.resume();
  }
}

async function enqueueAudio(mp3ArrayBuffer) {
  ensurePlaybackContext();
  try {
    const audioBuf = await audioCtx.decodeAudioData(mp3ArrayBuffer);
    audioQueue.push(audioBuf);
    if (!isPlayingAudio) playNextChunk();
  } catch (e) {
    console.warn('Failed to decode audio chunk', e);
  }
}

function playNextChunk() {
  if (audioQueue.length === 0) {
    isPlayingAudio = false;
    // If conversation is active and not responding, show listening
    if (active) setStatus('listening', 'listening');
    return;
  }
  isPlayingAudio = true;
  setStatus('speaking', 'speaking');
  const buf = audioQueue.shift();
  const src = audioCtx.createBufferSource();
  src.buffer = buf;
  src.connect(audioCtx.destination);
  src.onended = () => {
    playingSource = null;
    playNextChunk();
  };
  playingSource = src;
  src.start();
}

function stopPlayback() {
  audioQueue = [];
  if (playingSource) {
    try { playingSource.stop(); } catch {}
    playingSource = null;
  }
  isPlayingAudio = false;
}

// ── Mic capture via AudioWorklet ──
const WORKLET_CODE = `
class CaptureProcessor extends AudioWorkletProcessor {
  constructor() {
    super();
    this.buf = new Float32Array(320); // 20ms at 16kHz
    this.pos = 0;
  }
  process(inputs) {
    const ch = inputs[0] && inputs[0][0];
    if (!ch) return true;
    let i = 0;
    while (i < ch.length) {
      const n = Math.min(ch.length - i, 320 - this.pos);
      this.buf.set(ch.subarray(i, i + n), this.pos);
      this.pos += n;
      i += n;
      if (this.pos >= 320) {
        this.port.postMessage(this.buf.slice());
        this.pos = 0;
      }
    }
    return true;
  }
}
registerProcessor('capture', CaptureProcessor);
`;

async function startCapture() {
  // Create AudioContext at 16kHz
  if (audioCtx && audioCtx.state !== 'closed') {
    await audioCtx.close();
  }
  audioCtx = new AudioContext({ sampleRate: 16000 });

  mediaStream = await navigator.mediaDevices.getUserMedia({
    audio: { echoCancellation: true, noiseSuppression: true, sampleRate: 16000 }
  });

  const blob = new Blob([WORKLET_CODE], { type: 'application/javascript' });
  const url = URL.createObjectURL(blob);
  await audioCtx.audioWorklet.addModule(url);
  URL.revokeObjectURL(url);

  const source = audioCtx.createMediaStreamSource(mediaStream);
  captureNode = new AudioWorkletNode(audioCtx, 'capture');

  captureNode.port.onmessage = (e) => {
    if (!ws || ws.readyState !== WebSocket.OPEN) return;
    const f32 = e.data; // Float32Array[320]
    const i16 = new Int16Array(320);
    for (let j = 0; j < 320; j++) {
      i16[j] = Math.max(-32768, Math.min(32767, Math.round(f32[j] * 32768)));
    }
    ws.send(i16.buffer); // 640 bytes
  };

  source.connect(captureNode);
  // Don't connect to destination (no feedback loop)
}

function stopCapture() {
  if (captureNode) { captureNode.disconnect(); captureNode = null; }
  if (mediaStream) {
    mediaStream.getTracks().forEach(t => t.stop());
    mediaStream = null;
  }
}

// ── WebSocket ──
function connectWS(collection) {
  const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
  ws = new WebSocket(`${proto}//${location.host}/ws`);

  ws.onopen = () => {
    ws.send(JSON.stringify({ type: 'start', collection }));
    setStatus('listening', 'listening');
  };

  ws.onmessage = async (e) => {
    if (e.data instanceof Blob) {
      // Audio chunk (MP3)
      const buf = await e.data.arrayBuffer();
      enqueueAudio(buf);
      return;
    }
    const msg = JSON.parse(e.data);
    switch (msg.type) {
      case 'transcript':
        addMessage(msg.role, msg.text);
        break;
      case 'status':
        if (msg.text === 'listening') setStatus('listening', 'listening');
        else if (msg.text === 'transcribing') setStatus('transcribing...', 'thinking');
        else if (msg.text === 'thinking') setStatus('thinking...', 'thinking');
        else setStatus(msg.text, 'idle');
        break;
      case 'audio_start':
        setStatus('speaking', 'speaking');
        break;
      case 'audio_end':
        if (!isPlayingAudio && active) setStatus('listening', 'listening');
        break;
      case 'barge_in':
        stopPlayback();
        setStatus('listening', 'listening');
        break;
      case 'error':
        addMessage('assistant', '[Error] ' + msg.text);
        setStatus('error', 'idle');
        break;
    }
  };

  ws.onclose = () => {
    setStatus('disconnected', 'idle');
    active = false;
    btnTalk.classList.remove('active');
    btnTalk.textContent = '\u{1F3A4}';
    stopCapture();
  };

  ws.onerror = () => {
    setStatus('connection error', 'idle');
  };
}

// ── Button handlers ──
btnTalk.addEventListener('click', async () => {
  if (active) {
    // Stop
    active = false;
    btnTalk.classList.remove('active');
    btnTalk.textContent = '\u{1F3A4}';
    setStatus('tap to start', 'idle');
    stopCapture();
    stopPlayback();
    if (ws) { ws.close(); ws = null; }
    return;
  }

  const collection = selCollection.value;
  if (!collection) {
    setStatus('select a collection first', 'idle');
    return;
  }

  try {
    await startCapture();
    connectWS(collection);
    active = true;
    btnTalk.classList.add('active');
    btnTalk.textContent = '\u25A0'; // stop icon
    setStatus('connecting...', 'thinking');
  } catch (e) {
    console.error(e);
    setStatus('mic access denied', 'idle');
  }
});

btnClear.addEventListener('click', () => {
  chat.innerHTML = '';
  if (ws && ws.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify({ type: 'clear' }));
  }
});

// Keep screen awake while active (for walking)
let wakeLock = null;
async function requestWakeLock() {
  if ('wakeLock' in navigator) {
    try {
      wakeLock = await navigator.wakeLock.request('screen');
    } catch {}
  }
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && active) requestWakeLock();
});
</script>
</body>
</html>
